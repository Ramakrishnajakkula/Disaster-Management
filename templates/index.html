<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Management Chat Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Disaster Management Chat Bot    
            <i class="bi bi-box-arrow-right chat-history-icon" onclick="logout()"></i>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search history...">
            <button onclick="searchHistory()">Search</button>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Type your message..." onkeydown="if(event.keyCode === 13) sendMessage()">
        <button onclick="sendMessage()"><i class="bi bi-arrow-right" style="font-size: 24px;"></i></button>
    </div>
    <script>
        function sendMessage() {
            var userInput = document.getElementById("user-input").value;
            if (userInput.trim() !== "") {
                addMessage("user", userInput);
                fetch('/chat', {
                    method: 'POST',
                    body: JSON.stringify({ message: userInput }),
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.json())
                .then(data => {
                    addMessage("bot", data.response, userInput); // Pass user input for feedback
                })
                .catch(error => console.error('Error:', error));
                document.getElementById("user-input").value = "";
            }
        }

        function addMessage(sender, message, userMessage = "") {
            var chatBox = document.getElementById("chat-box");
            var messageElement = document.createElement("div");
            messageElement.classList.add("message", sender + "-message");
            messageElement.innerHTML = message;
            chatBox.appendChild(messageElement);

            // If the message is from the bot, add feedback options
            if (sender === "bot") {
                var feedbackElement = document.createElement("div");
                feedbackElement.classList.add("feedback-options");
                feedbackElement.innerHTML = `
                    <button onclick="sendFeedback(true, '${userMessage}')">👍</button>
                    <button onclick="sendFeedback(false, '${userMessage}')">👎</button>
                `;
                chatBox.appendChild(feedbackElement);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendFeedback(isHelpful, message) {
    fetch('/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, is_helpful: isHelpful })
    })
    .then(response => response.json())
    .then(data => {
        // Display the feedback status message in the chat box
        var chatBox = document.getElementById("chat-box");
        var feedbackStatusElement = document.createElement("div");
        feedbackStatusElement.classList.add("message", "feedback-status");
        feedbackStatusElement.innerHTML = data.status; // Display response message
        chatBox.appendChild(feedbackStatusElement);
        chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(error => console.error('Error:', error));
}


        function searchHistory() {
            var query = document.getElementById("search-input").value.toLowerCase();
            fetch('/search_history?query=' + query)
                .then(response => response.json())
                .then(data => {
                    var chatBox = document.getElementById("chat-box");
                    chatBox.innerHTML = "";
                    data.forEach(item => {
                        var historyUserMessage = document.createElement("div");
                        historyUserMessage.classList.add("message", "user-message");
                        historyUserMessage.innerHTML = item.message;
                        historyUserMessage.onclick = function() {
                            alert("Response: " + item.response);
                        };
                        chatBox.appendChild(historyUserMessage);

                        var clearButton = document.createElement("button");
                        clearButton.classList.add("clear-history-button");
                        clearButton.innerHTML = "Clear";
                        clearButton.onclick = function() {
                            clearHistory(item.message);
                        };
                        chatBox.appendChild(clearButton);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function clearHistory(message) {
            fetch('/clear_history', {
                method: 'POST',
                body: JSON.stringify({ message: message }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    searchHistory();
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function logout() {
            fetch('/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = '/login'; // Redirect to login page
                } else {
                    console.error('Logout failed');
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
